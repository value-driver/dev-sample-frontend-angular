<nz-card
  [nzTitle]="cardTitle"
  [nzExtra]="cardExtra"
  [nzActions]="[actionView, actionArchive]"
  class="h-full rounded-lg border border-[#D2D2D2]"
>
  <p class="line-clamp-2 min-h-10 text-sm text-[#787676]">
    {{ project().description }}
  </p>

  <div class="mt-3 space-y-2 border-t border-[#f1f5f9] pt-3 text-xs text-[#787676]">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <span class="flex items-center gap-1.5">
        <svg lucideUser class="h-3.5 w-3.5 text-[#787676]" aria-hidden="true"></svg>
        <strong class="text-[#101828]">{{ project().ownerName }}</strong>
      </span>
      <span class="flex items-center gap-1.5">
        <svg lucideUsers class="h-3.5 w-3.5 text-[#787676]" aria-hidden="true"></svg>
        {{ project().memberCount }} members
      </span>
    </div>
    <div class="flex items-center gap-1.5 text-[#787676]">
      <svg lucideCalendar class="h-3.5 w-3.5" aria-hidden="true"></svg>
      Created {{ project().createdAt | date: 'mediumDate' }}
    </div>
  </div>
</nz-card>

<ng-template #cardTitle>
  <a
    [routerLink]="['/projects', project().id]"
    class="text-sm font-semibold text-[#101828] transition hover:text-[#1350DF]"
  >
    {{ project().name }}
  </a>
</ng-template>

<ng-template #cardExtra>
  <nz-tag [nzColor]="statusColor(project().status)" class="uppercase font-medium text-xs">
    {{ project().status }}
  </nz-tag>
</ng-template>

<ng-template #actionView>
  <a
    [routerLink]="['/projects', project().id]"
    class="inline-flex items-center justify-center gap-1.5 text-xs leading-tight text-[#1350DF] hover:underline"
  >
    <svg lucideExternalLink class="h-3.5 w-3.5" aria-hidden="true"></svg>
    <span>Details</span>
  </a>
</ng-template>

<ng-template #actionArchive>
  <button
    type="button"
    nz-button
    nzType="link"
    nzDanger
    nzSize="small"
    [disabled]="project().status === 'archived'"
    (click)="archive()"
    class="text-xs leading-tight"
  >
    <svg lucideTrash2 class="h-3.5 w-3.5" aria-hidden="true"></svg>
    <span>Archive</span>
  </button>
</ng-template>
